---
# Provision a Raspberry Pi 4 (Raspberry Pi OS Lite 64-bit) as the pireplace appliance.
#
#   make deploy HOST=pireplace.local ANSIBLE_ARGS='-e @secrets.yml'
#
# Required variable: hotspot_password (8-63 characters). Set it in your own inventory,
# an extra-vars file, or ansible-vault. It is never committed.
# Idempotent: a second run reports changed=0.

- name: Validate inputs before touching the Pi
  hosts: all
  gather_facts: false
  tasks:
    - name: Require a usable hotspot_password
      ansible.builtin.assert:
        that:
          - hotspot_password is defined
          - (hotspot_password | string | length) >= 8
          - (hotspot_password | string | length) <= 63
          - not (hotspot_password | string).startswith('CHANGE_ME')
        fail_msg: >-
          hotspot_password is required: set it (8-63 characters, not the CHANGE_ME
          placeholder) in your inventory, an extra-vars file, or ansible-vault. It
          is the WPA2 password of the pireplace-setup hotspot and is never committed.
        quiet: true

    - name: Refuse the CHANGE_ME placeholder for the Jellyfin and Tailscale settings
      ansible.builtin.assert:
        that:
          - not (pireplace_jellyfin_api_key | default('', true) | string | trim).startswith('CHANGE_ME')
          - not (pireplace_tailscale_authkey | default('', true) | string | trim).startswith('CHANGE_ME')
          - not (pireplace_jellyfin_user_id | default('', true) | string | trim).startswith('CHANGE_ME')
        fail_msg: >-
          pireplace_jellyfin_api_key, pireplace_jellyfin_user_id or
          pireplace_tailscale_authkey is still the CHANGE_ME placeholder from
          inventory.example.ini: set the real value or remove the line.
        quiet: true

- name: Provision pireplace
  hosts: all
  become: true
  gather_facts: true
  vars:
    pireplace_user: pireplace
    pireplace_home: /home/pireplace
    pireplace_hostname: pireplace
    pireplace_hotspot_ssid: pireplace-setup
    # NetworkManager's default address for a shared (hotspot) connection.
    pireplace_hotspot_address: 10.42.0.1
    pireplace_allowed_hosts:
      - "{{ pireplace_hostname }}.local"
      - "{{ pireplace_hostname }}"
      - localhost
      - 127.0.0.1
    pireplace_default_mood: classic-swing
    pireplace_music_volume: 60
    pireplace_log_volume: 40
    pireplace_start_music: true
    # The SSH user gets write access to the media folders so rsync works.
    pireplace_admin_user: "{{ ansible_user | default(ansible_facts['env']['SUDO_USER'] | default('root')) }}"
    pireplace_moods:
      - modern
      - classic-swing
    # ALSA card of the HDMI port that carries sound: vc4hdmi0 is the port nearest the
    # USB-C power socket (HDMI-A-1), vc4hdmi1 the one farther from it.
    pireplace_hdmi_card: vc4hdmi0
    pireplace_cmdline_args: quiet loglevel=3 logo.nologo vt.global_cursor_default=0 consoleblank=0
    pireplace_user_units:
      - pireplace-video.service
      - pireplace-music.service
    pireplace_system_units:
      - pireplace-control.service
      - pireplace-wifi.service
    # Safety net for the NetworkManager profiles (oneshots: installed and enabled, never
    # restarted by the system-units handler).
    pireplace_netbackup_units:
      - pireplace-netrestore.service
      - pireplace-netbackup.service
      - pireplace-netbackup.path
    # Jellyfin music sync. Optional inventory vars: pireplace_jellyfin_api_key (turns it
    # on), pireplace_jellyfin_url, pireplace_jellyfin_user_id, pireplace_jellyfin_playlists
    # and pireplace_tailscale_authkey. Play vars outrank inventory vars, so the defaults
    # live in the pireplace_jf_* names and an inventory override is read through them.
    # The one test for "sync on": a token that is set, not null and not only whitespace.
    pireplace_jf_enabled: "{{ (pireplace_jellyfin_api_key | default('', true) | string | trim | length) > 0 }}"
    pireplace_jf_url: "{{ pireplace_jellyfin_url | default('http://100.88.8.6:8096') }}"
    # The sync unit may only reach this address (IPAddressAllow drop-in), so the URL
    # must name the server by its Tailscale IPv4 address.
    pireplace_jf_host: "{{ pireplace_jf_url | urlsplit('hostname') }}"
    # The non-admin Jellyfin user the sync reads as (music-streaming); the playlists
    # are shared with it read-only.
    pireplace_jf_user_id: "{{ pireplace_jellyfin_user_id | default('4640835a50a94bc69709d00d6f332fac') }}"
    pireplace_jf_playlists: "{{ pireplace_jellyfin_playlists | default(pireplace_jf_default_playlists) }}"
    pireplace_jf_default_playlists:
      harvest: 2468e8f94e04ea7cd30bc7e07e2cf723
      thanksgiving: e8fccbd51d0366b8e01c7c559280a23e
      autumn-standards: 8168bbe27de41b39641c7decf353feac
      four-seasons: bff6a0a9d940b5422c8c632c4bea3946
      spooky-classics: c2a72fb4b5e405f93e0f49073ff5465d
      monster-party: 99994b20b9e956085b7e570729cb9cf1
      graveyard-punk: dd675304017333b0dd2e8cdd8122719f
      goth-night: ce2cc8851c29a131ba05149e04fceb02
      classic-swing: f4b96696936ec335bfeca0c623ad0669
      modern: dc8d8d54ecad68b2546b5c7c9b4b4766
      soul-motown: 79525d419fccb3bec7c38cef5fe07b11
      instrumental: 30bf4d0f66600b1d1dd8cded00e25705
    # Audio the sync stores: "opus" (Jellyfin transcodes, about 3 GB for all twelve moods)
    # or "original" (files as uploaded). Optional inventory vars pireplace_jellyfin_audio_format
    # and pireplace_jellyfin_audio_bitrate_kbps (64-320, opus only).
    pireplace_jf_audio_format: "{{ pireplace_jellyfin_audio_format | default('opus') }}"
    pireplace_jf_audio_bitrate_kbps: "{{ pireplace_jellyfin_audio_bitrate_kbps | default(160) }}"
    # Seasons: the control page's season picker, in display order. Optional inventory
    # override pireplace_seasons_custom (same shape; an empty list turns the picker off).
    # The default seasons need the synced playlists, so without the sync there are none.
    pireplace_seasons: "{{ pireplace_seasons_custom | default(pireplace_seasons_default if pireplace_jf_enabled else []) }}"
    # Pre-flight checks over pireplace_seasons (the same rules as config.py _parse_seasons).
    pireplace_seasons_moods: "{{ pireplace_seasons | map(attribute='moods', default=[]) | list }}"
    pireplace_seasons_all_moods: "{{ pireplace_seasons_moods | select('sequence') | reject('string') | flatten }}"
    pireplace_seasons_bad_names: >-
      {{ pireplace_seasons | map(attribute='name', default='') | reject('string') | list
         + pireplace_seasons | map(attribute='name', default='') | select('string')
           | reject('match', '^[a-z0-9][a-z0-9-]*$(?!\n)') | list }}
    pireplace_seasons_bad_labels: >-
      {{ pireplace_seasons | map(attribute='label', default='') | reject('string') | list
         + pireplace_seasons | map(attribute='label', default='') | select('string')
           | map('trim') | select('equalto', '') | list }}
    pireplace_seasons_bad_moods: >-
      {{ pireplace_seasons_all_moods | reject('string') | list
         + pireplace_seasons_all_moods | select('string')
           | reject('match', '^[a-z0-9][a-z0-9-]*$(?!\n)') | list }}
    pireplace_seasons_unsourced: >-
      {{ pireplace_seasons_all_moods
         | reject('in', (pireplace_jf_playlists.keys() | list) if pireplace_jf_enabled else pireplace_moods)
         | list }}
    pireplace_seasons_default:
      - name: fall
        label: Fall
        moods: [harvest, thanksgiving, autumn-standards, four-seasons]
      - name: halloween
        label: Halloween
        moods: [spooky-classics, monster-party, graveyard-punk, goth-night]
      - name: winter
        label: Winter
        moods: [classic-swing, modern, soul-motown, instrumental]
    pireplace_sync_units:
      - pireplace-sync.service
      - pireplace-sync.timer
    # Tailscale login. The auth key only passes through a root-only file on tmpfs
    # (never argv), removed straight after `tailscale up`.
    pireplace_ts_authkey_file: /run/pireplace-tailscale-authkey
    pireplace_ts_have_key: "{{ (pireplace_tailscale_authkey | default('', true) | string | trim | length) > 0 }}"
    pireplace_ts_up_hint: >-
      sudo tailscale up --hostname=pireplace --accept-dns=false --shields-up
      --advertise-tags=tag:pireplace
    # What the owner must do, by tailscaled's BackendState (Running needs nothing).
    pireplace_ts_notes:
      NeedsLogin: >-
        Tailscale is not logged in. On the Pi run `{{ pireplace_ts_up_hint }}` and open
        the link it prints, or set pireplace_tailscale_authkey and deploy again.
      NeedsMachineAuth: >-
        Tailscale is logged in but the machine is waiting for approval: approve
        "pireplace" in the Tailscale admin console (Machines), then deploy again.
      Stopped: >-
        Tailscale is logged in but stopped (tailscale down). Run `sudo tailscale up`
        on the Pi.
      other: >-
        tailscaled reported state {{ pireplace_ts_backend_state }}. Check `sudo
        systemctl status tailscaled` and `sudo tailscale status` on the Pi.

  tasks:
    - name: Require Python 3.11 or newer on the Pi
      ansible.builtin.assert:
        that:
          - ansible_facts['python']['version_info'][0] == 3
          - ansible_facts['python']['version_info'][1] >= 11
        fail_msg: pireplace needs Python 3.11+; use Raspberry Pi OS Bookworm or newer.
        quiet: true

    - name: Require an IPv4 address in the Jellyfin URL (the sync unit may reach only it)
      ansible.builtin.assert:
        that:
          - pireplace_jf_host is match('^([0-9]{1,3}\.){3}[0-9]{1,3}$')
        fail_msg: >-
          pireplace_jellyfin_url must name the Jellyfin server by its Tailscale IPv4
          address (http://100.x.y.z:8096), not a host name: the sync service is only
          allowed to connect to that address.
        quiet: true
      when: pireplace_jf_enabled

    - name: Require valid seasons (names, labels, moods; no mood in two seasons)
      ansible.builtin.assert:
        that:
          - pireplace_seasons is sequence and pireplace_seasons is not string and pireplace_seasons is not mapping
          - pireplace_seasons_bad_names | length == 0
          - pireplace_seasons_bad_labels | length == 0
          - pireplace_seasons_moods | select('string') | list | length == 0
          - pireplace_seasons_moods | map('length') | select('equalto', 0) | list | length == 0
          - pireplace_seasons_bad_moods | length == 0
          - pireplace_seasons_all_moods | length == pireplace_seasons_all_moods | unique | list | length
        fail_msg: >-
          pireplace_seasons (pireplace_seasons_custom) is invalid. It must be a list of
          {name, label, moods}; every name and mood is lowercase letters, digits and -
          (starting with a letter or digit); every label is non-empty; every season has
          a non-empty list of moods; and a mood is in at most one season.
          Bad names: {{ pireplace_seasons_bad_names }}. Bad labels (empty or not text):
          {{ pireplace_seasons_bad_labels }}. Bad mood names: {{ pireplace_seasons_bad_moods }}.
          All moods listed (look for a repeat): {{ pireplace_seasons_all_moods }}.
        quiet: true

    - name: Require a source for every season mood (a playlist, or a pireplace_moods folder)
      ansible.builtin.assert:
        that:
          - pireplace_seasons_unsourced | length == 0
        fail_msg: >-
          These season moods have no source: {{ pireplace_seasons_unsourced }}. With the
          Jellyfin sync on, each must be a key of pireplace_jellyfin_playlists; otherwise
          each must be listed in pireplace_moods.
        quiet: true

    # --- identity and packages -------------------------------------------------

    - name: Set the hostname
      ansible.builtin.hostname:
        name: "{{ pireplace_hostname }}"

    - name: Keep /etc/hosts consistent with the hostname
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^127\.0\.1\.1\s'
        line: "127.0.1.1\t{{ pireplace_hostname }}"

    - name: Install packages
      ansible.builtin.apt:
        name:
          - mpv
          - pipewire
          - pipewire-pulse
          - wireplumber
          - network-manager
          # iw: counts hotspot clients (pireplace-wifi) and switches Wi-Fi power saving off.
          - iw
          # polkit evaluates 50-pireplace.rules; dbus-user-session gives the lingering
          # pireplace user manager its session bus (PipeWire, systemctl --user --machine=).
          - polkitd
          - dbus-user-session
          - avahi-daemon
          - python3
          - unattended-upgrades
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Limit unattended-upgrades to security updates (Debian, Raspberry Pi, Tailscale)
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/52pireplace-unattended-upgrades
        owner: root
        group: root
        mode: "0644"
        content: |
          // Managed by Ansible. Replaces the default origin list: Debian security
          // updates, the Raspberry Pi archive (kernel/firmware fixes ship there) and,
          // when it is installed, Tailscale's repository (limited to Tailscale's own
          // packages by /etc/apt/preferences.d/tailscale).
          #clear Unattended-Upgrade::Origins-Pattern;
          Unattended-Upgrade::Origins-Pattern {
              "origin=Debian,codename=${distro_codename}-security,label=Debian-Security";
              "origin=Debian,codename=${distro_codename},label=Debian-Security";
              "origin=Raspberry Pi Foundation,codename=${distro_codename},label=Raspberry Pi Foundation";
              "origin=Tailscale,codename=${distro_codename},label=Tailscale";
          };

    - name: Enable the daily unattended-upgrades run
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        owner: root
        group: root
        mode: "0644"
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";

    # --- Tailscale (the Jellyfin server is reached over the tailnet) ------------
    # Only with the Jellyfin sync on. Matches a hand install with the official script
    # (same keyring and source file), so on such a Pi every task here reports ok.

    - name: Tailscale (only with the Jellyfin sync on)
      when: pireplace_jf_enabled
      block:
        - name: Look for the Tailscale signing key
          ansible.builtin.stat:
            path: /usr/share/keyrings/tailscale-archive-keyring.gpg
          register: pireplace_ts_keyring

        - name: Fetch the Tailscale signing key (only when absent; the package keeps it afterwards)
          ansible.builtin.get_url:
            url: "https://pkgs.tailscale.com/stable/debian/{{ ansible_distribution_release }}.noarmor.gpg"
            dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
            owner: root
            group: root
            mode: "0644"
          when: not pireplace_ts_keyring.stat.exists
          register: pireplace_ts_key

        # lineinfile (not copy): the official script's file may carry a comment header.
        - name: Add the Tailscale apt source
          ansible.builtin.lineinfile:
            path: /etc/apt/sources.list.d/tailscale.list
            regexp: '^deb .*pkgs\.tailscale\.com'
            line: "deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/debian {{ ansible_distribution_release }} main"
            create: true
            owner: root
            group: root
            mode: "0644"
          register: pireplace_ts_source

        # unattended-upgrades follows this origin; only Tailscale's packages may come from it.
        - name: Pin the Tailscale repository to Tailscale's own packages
          ansible.builtin.copy:
            dest: /etc/apt/preferences.d/tailscale
            owner: root
            group: root
            mode: "0644"
            content: |
              # Managed by Ansible. pkgs.tailscale.com may only supply Tailscale's packages.
              Package: tailscale*
              Pin: origin pkgs.tailscale.com
              Pin-Priority: 500

              Package: *
              Pin: origin pkgs.tailscale.com
              Pin-Priority: -1

        - name: Refresh apt after adding the Tailscale repository
          ansible.builtin.apt:
            update_cache: true
          when: pireplace_ts_source is changed or pireplace_ts_key is changed

        - name: Install Tailscale
          ansible.builtin.apt:
            name:
              - tailscale
              - tailscale-archive-keyring
            state: present

        - name: Enable and start tailscaled
          ansible.builtin.systemd_service:
            name: tailscaled.service
            enabled: true
            state: started

        - name: Query the Tailscale login state
          ansible.builtin.command: tailscale status --json
          register: pireplace_ts_status
          changed_when: false
          failed_when: false

        - name: Read the Tailscale login state (BackendState)
          ansible.builtin.set_fact:
            pireplace_ts_backend_state: >-
              {{ (pireplace_ts_status.stdout | from_json).BackendState | default('Unknown')
                 if (pireplace_ts_status.stdout | default('', true) | trim).startswith('{')
                 else 'Unknown' }}

        # Only a node that needs a login: a logged-in node (Running, Stopped, waiting for
        # approval) is never re-authenticated. --auth-key=file: keeps the key off argv;
        # --shields-up because nothing on the tailnet needs to connect to the Pi.
        - name: Join the tailnet (only when it needs a login and an auth key was given)
          when:
            - pireplace_ts_backend_state == 'NeedsLogin'
            - pireplace_ts_have_key
          block:
            - name: Write the Tailscale auth key to a root-only file
              ansible.builtin.copy:
                dest: "{{ pireplace_ts_authkey_file }}"
                content: "{{ pireplace_tailscale_authkey | string | trim }}"
                owner: root
                group: root
                mode: "0600"
              no_log: true

            - name: Run tailscale up with the auth key
              ansible.builtin.command:
                argv:
                  - tailscale
                  - up
                  - --hostname=pireplace
                  - --accept-dns=false
                  - --shields-up
                  - --advertise-tags=tag:pireplace
                  - --timeout=60s
                  - "--auth-key=file:{{ pireplace_ts_authkey_file }}"
              changed_when: true
              no_log: true
          rescue:
            - name: Explain the failed Tailscale login
              ansible.builtin.fail:
                msg: >-
                  tailscale up failed: auth key rejected (expired, already used, or not
                  allowed to apply tag:pireplace) or no connection within 60 s. Re-authenticate
                  by hand: on the Pi run `{{ pireplace_ts_up_hint }}`, open the link, then
                  deploy again.
          always:
            - name: Remove the Tailscale auth key file
              ansible.builtin.file:
                path: "{{ pireplace_ts_authkey_file }}"
                state: absent

        - name: Tell the owner what Tailscale needs
          ansible.builtin.debug:
            msg: "{{ pireplace_ts_notes[pireplace_ts_backend_state] | default(pireplace_ts_notes['other']) }}"
          when:
            - pireplace_ts_backend_state != 'Running'
            - not (pireplace_ts_backend_state == 'NeedsLogin' and pireplace_ts_have_key)

    # --- service user ----------------------------------------------------------

    - name: Create the pireplace group
      ansible.builtin.group:
        name: "{{ pireplace_user }}"
        state: present

    - name: Create the pireplace user
      ansible.builtin.user:
        name: "{{ pireplace_user }}"
        group: "{{ pireplace_user }}"
        groups: [video, render, audio]
        append: true
        home: "{{ pireplace_home }}"
        create_home: true
        shell: /usr/sbin/nologin
        password_lock: true
      register: pireplace_user_result

    - name: Let the SSH admin user write media (member of the pireplace group)
      ansible.builtin.user:
        name: "{{ pireplace_admin_user }}"
        groups: [pireplace]
        append: true
      when: pireplace_admin_user != 'root'

    - name: Enable lingering so the user PipeWire session and player units start at boot
      ansible.builtin.command: loginctl enable-linger {{ pireplace_user }}
      args:
        creates: /var/lib/systemd/linger/{{ pireplace_user }}

    - name: Make sure the pireplace user manager is running
      ansible.builtin.systemd_service:
        name: user@{{ pireplace_user_result.uid }}.service
        state: started

    # --- application, config, media dirs --------------------------------------

    - name: Create application directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - /opt/pireplace
        - /opt/pireplace/pireplace
        - /opt/pireplace/pireplace/static

    - name: Install the application code
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: /opt/pireplace/pireplace/{{ item | basename }}
        owner: root
        group: root
        mode: "0644"
      loop: "{{ query('ansible.builtin.fileglob', playbook_dir + '/../../pireplace/*.py') }}"
      notify: Restart pireplace system services

    - name: Install the static web assets
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: /opt/pireplace/pireplace/static/{{ item | basename }}
        owner: root
        group: root
        mode: "0644"
      loop: "{{ query('ansible.builtin.fileglob', playbook_dir + '/../../pireplace/static/*') }}"
      notify: Restart pireplace system services

    - name: Create the config directory
      ansible.builtin.file:
        path: /etc/pireplace
        state: directory
        owner: root
        group: "{{ pireplace_user }}"
        mode: "0750"

    - name: Render the config (contains the hotspot password)
      ansible.builtin.template:
        src: config.toml.j2
        dest: /etc/pireplace/config.toml
        owner: root
        group: "{{ pireplace_user }}"
        mode: "0640"
      no_log: true
      notify: Restart pireplace system services

    # Root-only: pireplace-sync.service gets a copy through LoadCredential. The token is
    # never in config.toml.
    - name: Install the Jellyfin access token file
      ansible.builtin.copy:
        dest: /etc/pireplace/jellyfin.key
        content: "{{ pireplace_jellyfin_api_key | string | trim }}\n"
        owner: root
        group: root
        mode: "0600"
      when: pireplace_jf_enabled
      no_log: true

    - name: Remove the Jellyfin access token file (no key configured)
      ansible.builtin.file:
        path: /etc/pireplace/jellyfin.key
        state: absent
      when: not pireplace_jf_enabled

    - name: Create media directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ pireplace_user }}"
        group: "{{ pireplace_user }}"
        mode: "2775"
      loop: "{{ ['/srv/pireplace', '/srv/pireplace/videos', '/srv/pireplace/music'] + ((pireplace_jf_playlists.keys() | list if pireplace_jf_enabled else pireplace_moods) | map('regex_replace', '^', '/srv/pireplace/music/') | list) }}"

    # --- systemd, tmpfiles, polkit --------------------------------------------

    - name: Install the tmpfiles.d entry for the mpv sockets
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../tmpfiles/pireplace.conf"
        dest: /etc/tmpfiles.d/pireplace.conf
        owner: root
        group: root
        mode: "0644"
      notify: Apply tmpfiles

    - name: Install the polkit rule for NetworkManager access
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../polkit/50-pireplace.rules"
        dest: /etc/polkit-1/rules.d/50-pireplace.rules
        owner: root
        group: root
        mode: "0644"

    # No NetworkManager restart here: the playbook usually runs over Wi-Fi and a restart
    # would drop the SSH session. The handler reloads the conf and applies it to wlan0 now.
    - name: Turn Wi-Fi power saving off for NetworkManager connections
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../networkmanager/pireplace-wifi-powersave.conf"
        dest: /etc/NetworkManager/conf.d/pireplace-wifi-powersave.conf
        owner: root
        group: root
        mode: "0644"
      notify: Apply Wi-Fi power saving

    - name: Install system units
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../systemd/{{ item }}"
        dest: /etc/systemd/system/{{ item }}
        owner: root
        group: root
        mode: "0644"
      loop: "{{ pireplace_system_units }}"
      notify:
        - Reload systemd
        - Restart pireplace system services

    - name: Install the NetworkManager profile backup and restore units
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../systemd/{{ item }}"
        dest: /etc/systemd/system/{{ item }}
        owner: root
        group: root
        mode: "0644"
      loop: "{{ pireplace_netbackup_units }}"
      notify: Reload systemd

    - name: Install the Jellyfin sync units (service and timer)
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../systemd/{{ item }}"
        dest: /etc/systemd/system/{{ item }}
        owner: root
        group: root
        mode: "0644"
      loop: "{{ pireplace_sync_units }}"
      when: pireplace_jf_enabled
      notify: Reload systemd

    - name: Create the sync unit drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/system/pireplace-sync.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"
      when: pireplace_jf_enabled

    - name: Allow the sync service to reach the Jellyfin server (and nothing else off the Pi)
      ansible.builtin.copy:
        dest: /etc/systemd/system/pireplace-sync.service.d/50-jellyfin-address.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by Ansible: the host of pireplace_jellyfin_url. The unit itself denies
          # every address but loopback.
          [Service]
          IPAddressAllow={{ pireplace_jf_host }}/32
      when: pireplace_jf_enabled
      notify: Reload systemd

    - name: Remove the sync unit drop-ins (no key configured)
      ansible.builtin.file:
        path: /etc/systemd/system/pireplace-sync.service.d
        state: absent
      when: not pireplace_jf_enabled
      notify: Reload systemd

    - name: Look for installed Jellyfin sync units
      ansible.builtin.stat:
        path: /etc/systemd/system/pireplace-sync.timer
      register: pireplace_sync_timer_unit
      when: not pireplace_jf_enabled

    - name: Disable and stop the Jellyfin sync timer (no key configured)
      ansible.builtin.systemd_service:
        name: pireplace-sync.timer
        enabled: false
        state: stopped
      when:
        - not pireplace_jf_enabled
        - pireplace_sync_timer_unit.stat.exists

    - name: Remove the Jellyfin sync units (no key configured)
      ansible.builtin.file:
        path: /etc/systemd/system/{{ item }}
        state: absent
      loop: "{{ pireplace_sync_units }}"
      when: not pireplace_jf_enabled
      notify: Reload systemd

    - name: Install user units (run by the pireplace user manager)
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../systemd/{{ item }}"
        dest: /etc/systemd/user/{{ item }}
        owner: root
        group: root
        mode: "0644"
      loop: "{{ pireplace_user_units }}"
      notify: Restart pireplace player units

    # --- HDMI audio ------------------------------------------------------------
    # WirePlumber's ACP only offers off/pro-audio for the vc4-hdmi cards, so no HDMI
    # sink appears on its own. This defines one directly on ALSA's hdmi: PCM (which
    # converts to the IEC958 subframes the vc4 hardware needs). The high priorities
    # make WirePlumber choose it as the default sink.
    - name: Create the pireplace PipeWire config directory
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ pireplace_user }}"
        group: "{{ pireplace_user }}"
        mode: "{{ item.mode | default(omit) }}"
      loop:
        - path: "{{ pireplace_home }}/.config"   # existing mode is kept
        - {path: "{{ pireplace_home }}/.config/pipewire", mode: "0755"}
        - {path: "{{ pireplace_home }}/.config/pipewire/pipewire.conf.d", mode: "0755"}

    - name: Install the HDMI sink drop-in for the pireplace PipeWire
      ansible.builtin.copy:
        dest: "{{ pireplace_home }}/.config/pipewire/pipewire.conf.d/50-pireplace-hdmi.conf"
        owner: "{{ pireplace_user }}"
        group: "{{ pireplace_user }}"
        mode: "0644"
        content: |
          # Managed by Ansible. HDMI sink on ALSA card {{ pireplace_hdmi_card }}.
          context.objects = [
              {   factory = adapter
                  args = {
                      factory.name     = api.alsa.pcm.sink
                      node.name        = pireplace-hdmi
                      node.description = "Fireplace HDMI"
                      media.class      = Audio/Sink
                      api.alsa.path    = "hdmi:CARD={{ pireplace_hdmi_card }},DEV=0"
                      audio.format     = S16LE
                      audio.rate       = 48000
                      audio.channels   = 2
                      audio.position   = [ FL FR ]
                      priority.session = 2000
                      priority.driver  = 2000
                      node.pause-on-idle = false
                  }
              }
          ]
      notify: Restart pireplace audio and player units

    - name: Apply tmpfiles and systemd changes now
      ansible.builtin.meta: flush_handlers

    # Enable per user, for pireplace only, so an admin's SSH login never starts the
    # players. Debian's pipewire packages already enable PipeWire for every user (socket
    # activated: idle until something plays audio); that OS default is left alone, and
    # `is-enabled` then reports it as enabled here, which is all the players need.
    - name: Undo the every-user enablement of the player units from older playbooks
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: false
        scope: global
      loop: "{{ pireplace_user_units }}"

    - name: Enable PipeWire and the player units for the pireplace user
      ansible.builtin.shell:
        cmd: |
          set -e
          for unit in pipewire.socket pipewire-pulse.socket wireplumber.service {{ pireplace_user_units | join(' ') }}; do
            if ! systemctl --user --machine={{ pireplace_user }}@.host is-enabled --quiet "$unit"; then
              systemctl --user --machine={{ pireplace_user }}@.host enable "$unit"
              echo "enabled $unit"
            fi
          done
        executable: /bin/bash
      register: pireplace_user_enable
      changed_when: "'enabled ' in pireplace_user_enable.stdout"

    - name: Enable and start NetworkManager and Avahi
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - NetworkManager.service
        - avahi-daemon.service

    # Profiles must live as NetworkManager keyfiles. NM once wrote netplan YAML in place
    # (/etc/netplan/90-NM-*.yaml) and left the files empty, which cost the Pi all networking.
    # -e no keeps ':' in values unescaped; the UUID has none, so split at the first ':'.
    - name: List the NetworkManager profiles and where they are stored
      ansible.builtin.command:
        argv: [nmcli, -g, "UUID,FILENAME", -e, "no", connection, show]
      register: pireplace_nm_profiles
      changed_when: false
      check_mode: false

    # Report only: migrating a possibly active profile over the Wi-Fi SSH session is untested
    # and could drop access. Do it by hand from a console if this ever lists anything.
    - name: Report profiles still stored as netplan YAML (never migrated automatically)
      ansible.builtin.debug:
        msg: >-
          WARNING: NetworkManager profiles stored as netplan YAML (UUID:FILE):
          {{ pireplace_netplan_profiles | join(', ') }}. netplan storage can leave profiles
          empty. From a console (not over Wi-Fi SSH) run, for each UUID:
          sudo nmcli connection migrate --plugin keyfile UUID
      vars:
        pireplace_netplan_profiles: >-
          {{ pireplace_nm_profiles.stdout_lines
             | select('match', '^[^:]*:(/etc/netplan/|/run/NetworkManager/system-connections/netplan-)')
             | list }}
      when: pireplace_netplan_profiles | length > 0

    - name: Enable the NetworkManager profile backup, restore and watcher
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
      loop: "{{ pireplace_netbackup_units }}"

    - name: Start the profile watcher
      ansible.builtin.systemd_service:
        name: pireplace-netbackup.path
        state: started

    - name: Enable and start the control page and Wi-Fi watcher
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
      loop: "{{ pireplace_system_units }}"

    # Best effort: a failing first backup must not fail the deploy (the unit retries on
    # every profile change and every boot).
    - name: Back up the NetworkManager profiles once now
      ansible.builtin.command:
        argv: [systemctl, start, pireplace-netbackup.service]
      register: pireplace_netbackup_first
      changed_when: false
      failed_when: false

    - name: Warn when the first profile backup failed
      ansible.builtin.debug:
        msg: >-
          WARNING: the first NetworkManager profile backup failed (exit
          {{ pireplace_netbackup_first.rc }}). See `journalctl -u pireplace-netbackup`.
      when: pireplace_netbackup_first.rc | default(0) != 0

    - name: Enable and start the Jellyfin sync timer
      ansible.builtin.systemd_service:
        name: pireplace-sync.timer
        enabled: true
        state: started
      when: pireplace_jf_enabled

    # --- persistent journal ----------------------------------------------------

    # Raspberry Pi OS ships 40-rpi-volatile-storage.conf (Storage=volatile); 90- sorts after it.
    - name: Create the journald drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/journald.conf.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Keep the journal across reboots, capped for the SD card
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../journald/90-pireplace-persistent.conf"
        dest: /etc/systemd/journald.conf.d/90-pireplace-persistent.conf
        owner: root
        group: root
        mode: "0644"
      notify: Restart journald

    - name: Make sure the persistent journal directory exists
      ansible.builtin.file:
        path: /var/log/journal
        state: directory
        owner: root
        group: systemd-journal
        mode: "2755"
      notify: Restart journald

    # --- quiet TV --------------------------------------------------------------

    - name: Quiet the kernel console on the TV (takes effect after a reboot)
      ansible.builtin.lineinfile:
        path: /boot/firmware/cmdline.txt
        # Append once: only match a line that does not already end the arguments.
        regexp: '^(?!.*\bquiet loglevel=3 logo\.nologo vt\.global_cursor_default=0 consoleblank=0\b)(.*?)\s*$'
        line: '\1 {{ pireplace_cmdline_args }}'
        backrefs: true
      register: pireplace_cmdline

    # WARNING: never remove the last usable console from cmdline.txt. On the Pi 4 the
    # firmware passes 8250.nr_uarts=0, so console=serial0 is NOT usable; with no tty
    # console the boot stalls before userspace. Move the console to the invisible tty3
    # instead of deleting it (the HDMI screen is tty1 and stays blank). Boot messages
    # and the rescue shell are then on tty3 (Ctrl+Alt+F3, or `journalctl -b`).
    - name: Move the boot console from tty1 to tty3 so boot text stays off the TV (takes effect after a reboot)
      ansible.builtin.replace:
        path: /boot/firmware/cmdline.txt
        regexp: '(?<!\S)console=tty1(?!\S)'
        replace: 'console=tty3'
      register: pireplace_console

    # Neither tty1 nor tty3 present: add tty3 after console=serial0,115200 ...
    - name: Ensure a tty3 console exists (after console=serial0,115200)
      ansible.builtin.replace:
        path: /boot/firmware/cmdline.txt
        regexp: '\A(?!.*(?<!\S)console=tty3(?!\S))(.*?(?<!\S)console=serial0,115200(?!\S))'
        replace: '\1 console=tty3'
      register: pireplace_console_serial

    # ... or, with no serial0 token either, at the start of the line.
    - name: Ensure a tty3 console exists (at the start if no serial0 token)
      ansible.builtin.replace:
        path: /boot/firmware/cmdline.txt
        regexp: '\A(?!.*(?<!\S)console=tty3(?!\S))'
        replace: 'console=tty3 '
      register: pireplace_console_start

    # Imager's first-boot settings (user, Wi-Fi via netplan, hostname) are already
    # applied and persist without cloud-init. To undo: delete this file.
    - name: Ensure /etc/cloud and /etc/cloud/cloud.cfg.d exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - /etc/cloud
        - /etc/cloud/cloud.cfg.d

    # Never let cloud-init (Raspberry Pi Imager's /boot/firmware/network-config) render
    # netplan network config again.
    - name: Install the cloud-init drop-in that disables network config
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../cloud-init/99-pireplace-no-network.cfg"
        dest: /etc/cloud/cloud.cfg.d/99-pireplace-no-network.cfg
        owner: root
        group: root
        mode: "0644"

    - name: Disable cloud-init so its per-boot stages stay off the TV
      ansible.builtin.file:
        path: /etc/cloud/cloud-init.disabled
        state: touch
        owner: root
        group: root
        mode: "0644"
        modification_time: preserve
        access_time: preserve

    - name: Disable the firmware splash (takes effect after a reboot)
      ansible.builtin.lineinfile:
        path: /boot/firmware/config.txt
        regexp: '^#?\s*disable_splash='
        line: disable_splash=1
      register: pireplace_configtxt

    # The headphone jack is not used; HDMI carries the sound. lineinfile replaces the
    # (last) existing dtparam=audio= line, or appends one, so there is exactly one.
    - name: Turn off the onboard headphone-jack audio (takes effect after a reboot)
      ansible.builtin.lineinfile:
        path: /boot/firmware/config.txt
        regexp: '^#?\s*dtparam=audio='
        line: dtparam=audio=off
      register: pireplace_audio_off

    - name: Disable the login prompt on tty1
      ansible.builtin.systemd_service:
        name: getty@tty1.service
        masked: true
        state: stopped

    - name: Tell the operator to reboot
      ansible.builtin.debug:
        msg: >-
          REBOOT REQUIRED: /boot/firmware/cmdline.txt or config.txt changed. Run
          `sudo reboot` on the Pi so the TV shows only the fire.
      when: pireplace_cmdline is changed or pireplace_console is changed or pireplace_console_serial is changed or pireplace_console_start is changed or pireplace_configtxt is changed or pireplace_audio_off is changed

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Restart journald
      ansible.builtin.systemd_service:
        name: systemd-journald.service
        state: restarted

    - name: Move the volatile journal to disk
      ansible.builtin.command:
        argv: [journalctl, --flush]
      listen: Restart journald
      changed_when: true

    - name: Apply tmpfiles
      ansible.builtin.command: systemd-tmpfiles --create /etc/tmpfiles.d/pireplace.conf
      changed_when: true

    - name: Apply Wi-Fi power saving
      ansible.builtin.shell:
        cmd: |
          set -e
          nmcli general reload conf
          iw dev wlan0 set power_save off || true
        executable: /bin/bash
      changed_when: true

    - name: Restart pireplace system services
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: restarted
      loop: "{{ pireplace_system_units }}"

    - name: Restart pireplace player units
      ansible.builtin.shell:
        cmd: |
          set -e
          systemctl --user --machine={{ pireplace_user }}@.host daemon-reload
          systemctl --user --machine={{ pireplace_user }}@.host restart {{ pireplace_user_units | join(' ') }}
        executable: /bin/bash
      changed_when: true

    - name: Restart pireplace audio and player units
      ansible.builtin.shell:
        cmd: |
          set -e
          systemctl --user --machine={{ pireplace_user }}@.host daemon-reload
          systemctl --user --machine={{ pireplace_user }}@.host restart pipewire.service wireplumber.service pipewire-pulse.service
          systemctl --user --machine={{ pireplace_user }}@.host restart {{ pireplace_user_units | join(' ') }}
        executable: /bin/bash
      changed_when: true
