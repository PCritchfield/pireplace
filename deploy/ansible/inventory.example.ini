# Copy to deploy/ansible/inventory.ini and edit. Never commit real values.
#
#   cp deploy/ansible/inventory.example.ini deploy/ansible/inventory.ini
#   make deploy INVENTORY=deploy/ansible/inventory.ini
#
# `make deploy HOST=pireplace.local` builds a one-host inventory instead; pass the
# required hotspot_password with ANSIBLE_ARGS='-e @secrets.yml' (kept out of git).
[pireplace]
pireplace.local

[pireplace:vars]
# SSH user created by Raspberry Pi Imager. It is added to the pireplace group so
# rsync into /srv/pireplace works.
ansible_user=CHANGE_ME_ssh_user

# REQUIRED. Password of the 'pireplace-setup' hotspot (WPA2, 8-63 characters).
# Choose your own; the playbook refuses the CHANGE_ME placeholder. Prefer
# ansible-vault for the real value.
hotspot_password=CHANGE_ME_set_your_own

# Optional overrides (defaults shown). These are play variables, so they only take
# effect as extra vars (-e), not here; see README, "Known limitations".
# pireplace_default_mood=classic-swing
# pireplace_music_volume=60
# pireplace_log_volume=40
# pireplace_start_music=true

# Optional: nightly music sync from Jellyfin over Tailscale (see README, "Music from
# Jellyfin"). Setting the token turns it on; leave it out and nothing is installed.
# Prefer ansible-vault or `-e @secrets.yml` for the two secrets; the playbook refuses
# the CHANGE_ME placeholders. Keep comments on their own lines: in an INI inventory a
# trailing "# ..." becomes part of the value.
#
# Access token of the dedicated, non-admin Jellyfin user (music-streaming; not a
# dashboard API key); get it with ./scripts/jellyfin_token.sh.
# pireplace_jellyfin_api_key=CHANGE_ME_jellyfin_access_token
# The Id of that same user (jellyfin_token.sh prints it too). The default is the
# author's music-streaming user.
# pireplace_jellyfin_user_id=4640835a50a94bc69709d00d6f332fac
# Only needed to log a new node in to the tailnet.
# pireplace_tailscale_authkey=CHANGE_ME_tskey-auth-...
# The server's Tailscale IPv4 address (a host name is refused).
# pireplace_jellyfin_url=http://100.88.8.6:8096
# pireplace_jellyfin_playlists is a mood-to-playlist-Id map; set it in a vars file
# (-e @secrets.yml), not on an ini line.
