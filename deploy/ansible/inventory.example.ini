# Copy to deploy/ansible/inventory.ini and edit. Never commit real values.
#
#   cp deploy/ansible/inventory.example.ini deploy/ansible/inventory.ini
#   make deploy INVENTORY=deploy/ansible/inventory.ini
#
# `make deploy HOST=pireplace.local` builds a one-host inventory instead; pass the
# required hotspot_password with ANSIBLE_ARGS='-e @secrets.yml' (kept out of git).
[pireplace]
pireplace.local

[pireplace:vars]
# SSH user created by Raspberry Pi Imager. It is added to the pireplace group so
# rsync into /srv/pireplace works.
ansible_user=CHANGE_ME_ssh_user

# REQUIRED. Password of the 'pireplace-setup' hotspot (WPA2, 8-63 characters).
# Choose your own; the playbook refuses the CHANGE_ME placeholder. Prefer
# ansible-vault for the real value.
hotspot_password=CHANGE_ME_set_your_own

# Optional overrides (defaults shown).
# pireplace_default_mood=classic-swing
# pireplace_music_volume=60
# pireplace_log_volume=40
# pireplace_start_music=true
