<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1a0f0a">
<title>Fireplace</title>
<style>
  :root {
    --bg: #1a0f0a;
    --panel: #2a1810;
    --edge: #4a2c1a;
    --text: #f6e7d3;
    --muted: #b99a7d;
    --ember: #e8741f;
    --ember-hi: #ffa24a;
    --warn: #ffcf8a;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font: 18px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 520px; margin: 0 auto; }
  h1 { margin: 0 0 12px; font-size: 1.5rem; color: var(--ember-hi); letter-spacing: .02em; }
  h2 { margin: 0 0 10px; font-size: .85rem; font-weight: 600; text-transform: uppercase;
       letter-spacing: .1em; color: var(--muted); }
  section { background: var(--panel); border: 1px solid var(--edge); border-radius: 14px;
            padding: 14px; margin-bottom: 14px; }
  button {
    min-height: 48px;
    padding: 0 16px;
    font: inherit;
    font-weight: 600;
    color: var(--text);
    background: #3a2216;
    border: 1px solid var(--edge);
    border-radius: 10px;
    cursor: pointer;
    touch-action: manipulation;
  }
  button:active:not(:disabled) { background: #52301c; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--ember-hi); outline-offset: 2px; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.on { background: var(--ember); border-color: var(--ember-hi); color: #1a0f0a; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
  .row { display: flex; gap: 10px; }
  .row > button { flex: 1; }
  #now { min-height: 1.4em; margin: 0 0 12px; font-size: 1.05rem; overflow-wrap: anywhere; }
  .slider { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
  .slider input { flex: 1; min-height: 44px; accent-color: var(--ember); }
  .slider output { width: 3ch; text-align: right; font-variant-numeric: tabular-nums; }
  .msg { color: var(--warn); margin: 8px 0 0; }
  #err { color: #ff8a7a; min-height: 1.4em; margin: 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Fireplace</h1>

  <section id="music-sec">
    <h2>Music</h2>
    <p id="now" aria-live="polite"></p>
    <div class="row">
      <button id="playpause" type="button">Play</button>
      <button id="next" type="button">Next</button>
    </div>
    <label class="slider">
      <span>Volume</span>
      <input id="music-vol" type="range" min="0" max="100" step="1">
      <output id="music-vol-out">0</output>
    </label>
    <p id="music-msg" class="msg" hidden></p>
  </section>

  <section>
    <h2>Mood</h2>
    <div id="moods" class="grid"></div>
    <p id="mood-msg" class="msg" hidden></p>
  </section>

  <section id="log-sec">
    <h2>Fire sound</h2>
    <button id="mute" type="button" aria-pressed="false">Fire sound on</button>
    <label class="slider">
      <span>Volume</span>
      <input id="log-vol" type="range" min="0" max="100" step="1">
      <output id="log-vol-out">0</output>
    </label>
    <p id="log-msg" class="msg" hidden></p>
  </section>

  <button id="rescan" type="button" style="width:100%">Rescan media</button>
  <p id="err" role="status"></p>
</main>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var DEBOUNCE_MS = 250, POLL_MS = 5000;
  var current = null;       // last status received
  var dragging = {};        // slider id -> true while the user is adjusting it
  var timers = {};

  function api(method, path, body) {
    var opts = { method: method, headers: {} };
    if (body !== undefined) {
      opts.headers["Content-Type"] = "application/json";
      opts.body = JSON.stringify(body);
    }
    return fetch(path, opts).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (data) {
        if (!r.ok) { throw new Error(data.error || ("HTTP " + r.status)); }
        return data;
      });
    });
  }

  function showError(e) { $("err").textContent = e ? String(e.message || e) : ""; }

  function setMsg(id, text) {
    var el = $(id);
    el.textContent = text || "";
    el.hidden = !text;
  }

  function render(s) {
    current = s;
    var music = s.music || {}, log = s.log || {};

    // music
    var mAvail = !!music.available;
    $("now").textContent = !mAvail ? "" : (music.now_playing || "Nothing playing");
    $("playpause").textContent = music.playing ? "Pause" : "Play";
    $("playpause").disabled = !mAvail;
    $("next").disabled = !mAvail;
    $("music-vol").disabled = !mAvail;
    setMsg("music-msg", mAvail ? "" : "Music player is not running.");
    if (mAvail && !dragging["music-vol"]) { setSlider("music-vol", music.volume); }

    // moods
    var wrap = $("moods");
    var moods = s.moods || [];
    while (wrap.firstChild) { wrap.removeChild(wrap.firstChild); }
    moods.forEach(function (m) {
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = m.label;
      b.disabled = !mAvail || m.tracks === 0;
      if (m.name === s.mood) { b.className = "on"; b.setAttribute("aria-pressed", "true"); }
      b.addEventListener("click", function () { act("POST", "/api/mood", { mood: m.name }); });
      wrap.appendChild(b);
    });
    setMsg("mood-msg", moods.length ? "" : "No music moods found. Add folders of music and tap Rescan.");

    // fire log
    var lAvail = !!log.available;
    $("mute").disabled = !lAvail;
    $("log-vol").disabled = !lAvail;
    $("mute").textContent = log.muted ? "Fire sound off" : "Fire sound on";
    $("mute").className = lAvail && !log.muted ? "on" : "";
    $("mute").setAttribute("aria-pressed", String(lAvail && !log.muted));
    if (lAvail && !dragging["log-vol"]) { setSlider("log-vol", log.volume); }
    setMsg("log-msg", !lAvail ? "Fire video player is not running."
                     : (log.videos === 0 ? "No fire videos found. Add videos and tap Rescan." : ""));
  }

  function setSlider(id, value) {
    $(id).value = value;
    $(id + "-out").textContent = value;
  }

  function act(method, path, body) {
    return api(method, path, body).then(function (s) { showError(null); render(s); })
      .catch(function (e) { showError(e); return refresh(); });
  }

  function refresh() {
    return api("GET", "/api/status").then(function (s) { showError(null); render(s); })
      .catch(showError);
  }

  function wireSlider(id, target) {
    var el = $(id);
    el.addEventListener("input", function () {
      dragging[id] = true;
      $(id + "-out").textContent = el.value;
      clearTimeout(timers[id]);
      timers[id] = setTimeout(function () {
        var level = parseInt(el.value, 10);
        act("POST", "/api/volume", { target: target, level: level })
          .then(function () { dragging[id] = false; });
      }, DEBOUNCE_MS);
    });
  }

  $("playpause").addEventListener("click", function () {
    var playing = current && current.music && current.music.playing;
    act("POST", "/api/music", { action: playing ? "pause" : "play" });
  });
  $("next").addEventListener("click", function () { act("POST", "/api/music", { action: "next" }); });
  $("mute").addEventListener("click", function () {
    var muted = !!(current && current.log && current.log.muted);
    act("POST", "/api/log", { muted: !muted });
  });
  $("rescan").addEventListener("click", function () { act("POST", "/api/rescan"); });
  wireSlider("music-vol", "music");
  wireSlider("log-vol", "log");

  refresh();
  setInterval(refresh, POLL_MS);
})();
</script>
</body>
</html>
